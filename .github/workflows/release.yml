name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          package=$(node -p "require('./create-wiki/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$package" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME, package.json $version and create-wiki $package must match" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Notes
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Open Stream Deck Wiki ${{ needs.version.outputs.version }}" \
              --notes-file notes.md \
              --verify-tag
          fi

  npm:
    needs: [version, release]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish @opensd/create-wiki
        working-directory: create-wiki
        run: |
          if npm view "@opensd/create-wiki@${{ needs.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "@opensd/create-wiki@${{ needs.version.outputs.version }} is already published"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
